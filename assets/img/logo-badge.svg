<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be" />
      <stop offset="30%" stop-color="#e8c86d" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#916f15" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143324" />
      <stop offset="100%" stop-color="#081810" />
    </linearGradient>
  </defs>

  <!-- Ornate Golden Badge Box -->
  <rect x="6" y="6" width="108" height="108" rx="8" fill="url(#badgeBg)" stroke="url(#badgeGold)" stroke-width="2.5" />
  <rect x="11" y="11" width="98" height="98" rx="5" fill="none" stroke="url(#badgeGold)" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.7"/>

  <!-- Ornate Crest -->
  <g transform="translate(60, 46)">
    <!-- Horn Swirls Motif -->
    <path d="M0 -24 L16 -12 L12 -9 L0 -17 L-12 -9 L-16 -12 Z" fill="url(#badgeGold)" />
    <path d="M0 -8 C6 -13 16 -13 20 -7 C23 -2 21 5 16 7 C12 9 8 5 9 2 C10 -1 13 1 12 3 C13 0 12 -5 9 -7 C6 -9 2 -7 0 -4 C-2 -7 -6 -9 -9 -7 C-12 -5 -13 0 -12 3 C-13 1 -10 -1 -9 2 C-8 5 -12 9 -16 7 C-21 5 -23 -2 -20 -7 C-16 -13 -6 -13 0 -8 Z" fill="url(#badgeGold)"/>
    <circle cx="0" cy="5" r="3" fill="url(#badgeGold)" />
  </g>

  <!-- Text inside badge -->
  <text x="60" y="80" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="url(#badgeGold)">DOMBASTIS</text>
  <text x="60" y="94" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="8" font-weight="600" letter-spacing="3" fill="#edd082">HERITAGE</text>
  <text x="60" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" letter-spacing="1" fill="#9bb3a3">EST. 2026</text>
</svg>
