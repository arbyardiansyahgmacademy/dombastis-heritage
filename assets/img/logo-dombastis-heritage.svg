<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b3" />
      <stop offset="35%" stop-color="#e5c365" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b1b" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7b1b" />
      <stop offset="50%" stop-color="#fae498" />
      <stop offset="100%" stop-color="#9a7b1b" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem / Crest -->
  <g transform="translate(10, 10)">
    <!-- Ornate Outer Hexagon / Shield -->
    <path d="M30 2 L56 16 L56 44 L30 58 L4 44 L4 16 Z" fill="#071b12" stroke="url(#goldBorder)" stroke-width="1.8"/>
    <!-- Inner Heritage Motif (Stylized Horn & Joglo Roof) -->
    <path d="M30 8 L44 19 L40 22 L30 15 L20 22 L16 19 Z" fill="url(#goldGrad)" />
    <!-- Curved Ornamental Ram Horns / Heritage Swirls -->
    <path d="M30 24 C34 20 42 20 46 25 C49 29 48 35 43 37 C39 39 36 36 36 34 C36 32 38 30 40 31 C42 32 43 34 41 35 C42 33 42 28 39 26 C36 24 32 25 30 28 C28 25 24 24 21 26 C18 28 18 33 19 35 C17 34 18 32 20 31 C22 30 24 32 24 34 C24 36 21 39 17 37 C12 35 11 29 14 25 C18 20 26 20 30 24 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    <!-- Center Jewel Star -->
    <polygon points="30,34 32,39 37,39 33,42 35,47 30,44 25,47 27,42 23,39 28,39" fill="url(#goldGrad)" />
    <!-- Bottom Flourish -->
    <circle cx="30" cy="51" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 20)">
    <text x="0" y="24" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="21" font-weight="700" letter-spacing="3" fill="url(#goldGrad)">DOMBASTIS</text>
    <text x="0" y="44" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="600" letter-spacing="6" fill="#e5c365" opacity="0.95">HERITAGE</text>
    <!-- Elegant Divider Accent -->
    <line x1="0" y1="31" x2="220" y2="31" stroke="url(#goldBorder)" stroke-width="0.8" opacity="0.5" />
  </g>
</svg>
